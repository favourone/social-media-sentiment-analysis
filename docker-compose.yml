services:
  # Redis 保存 RQ 任务队列，并通过 AOF 提供持久化。
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web 服务使用 Waitress 对外提供页面和 API。
  web:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      TASK_QUEUE_MODE: rq
      REDIS_URL: redis://redis:6379/0
      RUNTIME_DIR: /app/runtime
      PRODUCT_DB_PATH: /app/runtime/sentiment.db
      REPORT_DIR: /app/runtime/reports
      IMPORT_DIR: /app/runtime/imports
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - app-runtime:/app/runtime
    depends_on:
      redis:
        condition: service_healthy

  # Worker 串行执行采集、分析和报告生成等耗时任务。
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file: ${ENV_FILE:-.env}
    environment:
      TASK_QUEUE_MODE: rq
      REDIS_URL: redis://redis:6379/0
      RUNTIME_DIR: /app/runtime
      PRODUCT_DB_PATH: /app/runtime/sentiment.db
      REPORT_DIR: /app/runtime/reports
      IMPORT_DIR: /app/runtime/imports
    volumes:
      - app-runtime:/app/runtime
    depends_on:
      redis:
        condition: service_healthy

  # Scheduler 定期扫描到期监测项目，并将任务送入 RQ 队列。
  scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "services.scheduler"]
    env_file: ${ENV_FILE:-.env}
    environment:
      TASK_QUEUE_MODE: rq
      REDIS_URL: redis://redis:6379/0
      RUNTIME_DIR: /app/runtime
      PRODUCT_DB_PATH: /app/runtime/sentiment.db
      REPORT_DIR: /app/runtime/reports
      IMPORT_DIR: /app/runtime/imports
    volumes:
      - app-runtime:/app/runtime
    depends_on:
      redis:
        condition: service_healthy

volumes:
  # 保存 SQLite、导入文件和生成报告。
  app-runtime:
  # 保存 Redis AOF 队列数据。
  redis-data:
